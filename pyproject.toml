[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-claim-audit"
version = "0.1.0"
description = "Offline audit of documented code-reading capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
barcode-claim-audit = "barcode_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["barcode_claim_audit*"]
